<!DOCTYPE html>
<html>
<head>
  <title>RFID Attendance Dashboard</title>
  <style>
    body { font-family: Arial; background: #0f172a; color: white; text-align: center; }
    h1 { margin-top: 20px; }
    table { margin: auto; border-collapse: collapse; width: 60%; }
    th, td { padding: 10px; border: 1px solid #ccc; }
    .present { color: lime; }
    .absent { color: red; }
  </style>
</head>
<body>

<h1>Class Attendance Dashboard</h1>

<table id="attendanceTable">
  <tr>
    <th>Name</th>
    <th>Status</th>
  </tr>
</table>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  const supabase = window.supabase.createClient(
    'https://wgrohfyljmylamvnwjpj.supabase.co',
    'sb_publishable_CtgmqdL-YSPFimgvFZtUSg_7s8U0-MH'
  );

  // Load attendance from database
  async function loadAttendance() {
    const { data, error } = await supabase
      .from('attendance')
      .select('*');

    if (error) {
      console.log(error);
      return;
    }

    const table = document.getElementById("attendanceTable");

    data.forEach(row => {
      const tr = document.createElement("tr");

      const nameTd = document.createElement("td");
      nameTd.textContent = row.name;

      const statusTd = document.createElement("td");
      statusTd.textContent = "Present";
      statusTd.className = "present";

      tr.appendChild(nameTd);
      tr.appendChild(statusTd);
      table.appendChild(tr);
    });
  }

  loadAttendance();

  console.log("Connected to Supabase 🔥");
</script>

</body>
</html>
