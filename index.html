<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RFID Attendance Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

table{
    width:80%;
    margin:auto;
    border-collapse:collapse;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#334155;
    padding:15px;
    font-size:18px;
}

td{
    padding:12px;
    border-bottom:1px solid #475569;
}

.present{
    color:lime;
    font-weight:bold;
}

.absent{
    color:red;
    font-weight:bold;
}

.statusBox{
    margin-top:20px;
    font-size:18px;
}

</style>
</head>

<body>

<h1>📡 RFID Attendance Dashboard</h1>

<table id="attendanceTable">

<tr>
    <th>Name</th>
    <th>Status</th>
    <th>Time</th>
</tr>

</table>

<div class="statusBox" id="statusBox">
    Waiting for RFID scans...
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

// =====================================
// SUPABASE CONNECTION
// =====================================

const supabase = window.supabase.createClient(
    'https://wgrohfyljmylamvnwjpj.supabase.co',
    'sb_publishable_CtgmqdL-YSPFimgvFZtUSg_7s8U0-MH'
);

// =====================================
// LOAD ATTENDANCE
// =====================================

async function loadAttendance(){

    const { data, error } = await supabase
        .from('attendance')
        .select('*')
        .order('timestamp', { ascending:false });

    if(error){

        console.log("Database Error:", error);

        document.getElementById("statusBox").textContent =
            "❌ Failed to connect to database";

        return;
    }

    const table = document.getElementById("attendanceTable");

    // RESET TABLE
    table.innerHTML = `
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Time</th>
        </tr>
    `;

    data.forEach(row => {

        const tr = document.createElement("tr");

        // NAME
        const nameTd = document.createElement("td");
        nameTd.textContent = row.name || "Unknown";

        // STATUS
        const statusTd = document.createElement("td");
        statusTd.textContent = "Present";
        statusTd.className = "present";

        // TIME
        const timeTd = document.createElement("td");

        if(row.timestamp){

            const date = new Date(row.timestamp);

            timeTd.textContent = date.toLocaleString();

        }else{

            timeTd.textContent = "-";

        }

        tr.appendChild(nameTd);
        tr.appendChild(statusTd);
        tr.appendChild(timeTd);

        table.appendChild(tr);

    });

    document.getElementById("statusBox").textContent =
        "✅ Connected to Supabase";

}

// =====================================
// INSERT ATTENDANCE
// =====================================

async function markAttendance(name){

    const { error } = await supabase
        .from('attendance')
        .insert([
            {
                name:name
            }
        ]);

    if(error){

        console.log("Insert Error:", error);

        document.getElementById("statusBox").textContent =
            "❌ Failed to save attendance";

        return;
    }

    document.getElementById("statusBox").textContent =
        `✅ ${name} marked present`;

    loadAttendance();

}

// =====================================
// AUTO REFRESH
// =====================================

setInterval(loadAttendance, 5000);

// =====================================
// START
// =====================================

loadAttendance();

console.log("🔥 RFID Attendance System Ready");

</script>

</body>
</html>
